id: REPLACE_WITH_RAYFIN_APP_ID
name: aw-performance
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173

  data:
    enabled: false
  storage:
    enabled: false
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
  functions:
    enabled: false
connectors:
  - name: salesmodel
    type: fabric-semanticmodel
    config:
      workspaceId: REPLACE_WITH_WORKSPACE_ID
      itemId: REPLACE_WITH_SEMANTIC_MODEL_ID
    auth:
      type: delegated
    version: "1"
    operations:
      - name: executeQuery
